# ── Servidor ──────────────────────────────────────────
server.port=8080

# ── Base de Dados ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/labsecure
spring.datasource.username=labsecure_user
spring.datasource.password=labsecure123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Email (Gmail como exemplo) ─────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL@gmail.com
spring.mail.password=SUA_SENHA_APP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Twilio (SMS) ───────────────────────────────────────
twilio.account-sid=SEU_ACCOUNT_SID
twilio.auth-token=SEU_AUTH_TOKEN
twilio.from-number=+1XXXXXXXXXX

# ── SafeLab Config ─────────────────────────────────────
# Janela de tempo (segundos) para associar tag de funcionário à tag de equipamento
safelab.auth-window-seconds=10
# Email e telefone do responsável de segurança
safelab.alert-email=seguranca@isptec.co.ao
safelab.alert-phone=+244XXXXXXXXX
